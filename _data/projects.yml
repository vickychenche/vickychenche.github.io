- title: "Crafting Interpreter: Clox"
  summary: "Implemented a bytecode virtual machine (VM) from scratch, focusing on low-level memory management and runtime optimization. Developed a recursive descent parser and abstract syntax tree (AST) to compile high-level Lox code into bytecode. Built core components including garbage collection, object representation, and bytecode compilation. Gained hands-on experience with stack-based execution, bytecode generation, and memory safety while implementing the VM."
  link: "https://github.com/vickychenche/Crafting_Interpreter"
  category: "Technical"
  skills:
    - "C"
    - "memory management"
    - "virtual machine"
    - "compiler design"
    - "garbage collection"

- title: "Application and Analysis of Black and White Image Colorization Using Modified UNet and Patch GAN"
  summary: "Implemented a GAN model with a U-Net generator and PatchGAN discriminator to colorize grayscale images, focusing on naturalistic color reproduction and fine detail. Modified commonly used U-Net architecture by introducing a bottleneck based on recurrent neural networks (RNN) to handle complex dependencies between colorized outputs, producing a more saturated and vibrant image."
  link: "https://github.com/Ibraheem014/ColorGANvas"
  category: "Technical"
  skills:
    - "PyTorch"
    - "GAN"
    - "U-Net"

- title: "Rust Audio Player"
  summary: "Learned Rust fundamentals by building a GUI-based audio player, exploring ownership, borrowing, and memory safety concepts through hands-on implementation. Integrated Rust GUI crates to create an interactive user interface, gaining experience with Rust's crate ecosystem and dependency management. Implemented audio playback and playlist management features, applying Rust's type system and error handling patterns to build a functional application. Developed proficiency in Rust by working with external libraries, file I/O operations, and asynchronous programming patterns."
  link: "https://github.com/vickychenche/audio_player"
